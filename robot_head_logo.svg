<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <!-- Shading gradients matching media_1791379089475.png -->
    <linearGradient id="headBaseGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="bluePlasticGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="amberEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="eyeIrisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="mouthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f0f1d"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#glowSubtle)">
    <!-- Red Neck Collar -->
    <path d="M52,118 L88,118 L84,128 L56,128 Z" fill="#ef4444" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M54,120 L86,120" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left Ear / Headphone -->
    <!-- Connection Stem -->
    <rect x="22" y="66" width="10" height="14" rx="3" fill="#0284c7" stroke="#1e293b" stroke-width="3"/>
    <!-- Outer Blue Pod -->
    <rect x="15" y="55" width="12" height="36" rx="6" fill="url(#bluePlasticGrad)" stroke="#1e293b" stroke-width="3.2"/>
    <!-- Inner Amber Core -->
    <rect x="13" y="61" width="7" height="24" rx="3.5" fill="url(#amberEarGrad)" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Amber Specular Highlight -->
    <ellipse cx="16" cy="68" rx="1.5" ry="4" fill="#ffffff" opacity="0.75"/>

    <!-- Right Ear / Headphone -->
    <!-- Connection Stem -->
    <rect x="108" y="66" width="10" height="14" rx="3" fill="#0284c7" stroke="#1e293b" stroke-width="3"/>
    <!-- Outer Blue Pod -->
    <rect x="113" y="55" width="12" height="36" rx="6" fill="url(#bluePlasticGrad)" stroke="#1e293b" stroke-width="3.2"/>
    <!-- Inner Amber Core -->
    <rect x="120" y="61" width="7" height="24" rx="3.5" fill="url(#amberEarGrad)" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Amber Specular Highlight -->
    <ellipse cx="123" cy="68" rx="1.5" ry="4" fill="#ffffff" opacity="0.75"/>

    <!-- Antenna On Top -->
    <!-- Yellow/Gold Base Trim -->
    <rect x="58" y="32" width="24" height="6" rx="2" fill="#eab308" stroke="#1e293b" stroke-width="3"/>
    <!-- Stepped Blue Cap -->
    <path d="M62,32 L64,18 L76,18 L78,32 Z" fill="url(#bluePlasticGrad)" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
    <line x1="66" y1="20" x2="74" y2="20" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
    <!-- Antenna Metal Post -->
    <rect x="68" y="10" width="4" height="9" fill="#94a3b8" stroke="#1e293b" stroke-width="2.5"/>
    <!-- Antenna Tip Ball (Cyan-Blue) -->
    <circle cx="70" cy="8" r="7" fill="url(#bluePlasticGrad)" stroke="#1e293b" stroke-width="3"/>
    <circle cx="68" cy="6" r="2.2" fill="#ffffff"/>

    <!-- Main Robot Head (Square with rounded corners) -->
    <rect x="29" y="34" width="82" height="84" rx="18" fill="url(#headBaseGrad)" stroke="#1e293b" stroke-width="4.2" stroke-linejoin="round"/>
    <!-- Specular Highlight Top Bevel -->
    <path d="M44,40 L96,40" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M37,47 L37,90" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cheerful Eyebrows -->
    <path d="M44,51 Q51,46 59,51" fill="none" stroke="#1e293b" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M81,51 Q89,46 96,51" fill="none" stroke="#1e293b" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Left Eye -->
    <g>
      <!-- Eye Socket Outline -->
      <ellipse cx="52" cy="68" rx="9" ry="13" fill="#0f172a" stroke="#1e293b" stroke-width="3.5"/>
      <!-- Eye Iris -->
      <ellipse cx="52" cy="70" rx="8" ry="10" fill="url(#eyeIrisGrad)"/>
      <ellipse cx="52" cy="72" rx="5.5" ry="7" fill="#0369a1"/>
      <ellipse cx="52" cy="73" rx="3.5" ry="4.5" fill="#0f172a"/>
      <!-- Catchlights (Sparkles) -->
      <circle cx="49" cy="63" r="3.2" fill="#ffffff"/>
      <circle cx="55" cy="74" r="1.6" fill="#ffffff"/>
      <!-- Lower Eyelid Light -->
      <path d="M47,77 Q52,80 57,77" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.8"/>
    </g>

    <!-- Right Eye -->
    <g>
      <!-- Eye Socket Outline -->
      <ellipse cx="88" cy="68" rx="9" ry="13" fill="#0f172a" stroke="#1e293b" stroke-width="3.5"/>
      <!-- Eye Iris -->
      <ellipse cx="88" cy="70" rx="8" ry="10" fill="url(#eyeIrisGrad)"/>
      <ellipse cx="88" cy="72" rx="5.5" ry="7" fill="#0369a1"/>
      <ellipse cx="88" cy="73" rx="3.5" ry="4.5" fill="#0f172a"/>
      <!-- Catchlights (Sparkles) -->
      <circle cx="85" cy="63" r="3.2" fill="#ffffff"/>
      <circle cx="91" cy="74" r="1.6" fill="#ffffff"/>
      <!-- Lower Eyelid Light -->
      <path d="M83,77 Q88,80 93,77" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.8"/>
    </g>

    <!-- Rosy Cheek Blush -->
    <ellipse cx="38" cy="78" rx="6" ry="3.5" fill="#fda4af" opacity="0.55"/>
    <ellipse cx="102" cy="78" rx="6" ry="3.5" fill="#fda4af" opacity="0.55"/>

    <!-- Happy Open Mouth Smile -->
    <g>
      <!-- Mouth Cavity -->
      <path d="M57,88 Q70,89 83,88 Q85,106 70,106 Q55,106 57,88 Z" fill="url(#mouthGrad)" stroke="#1e293b" stroke-width="3.2" stroke-linejoin="round"/>
      <!-- Top Teeth -->
      <path d="M59,89 Q70,90 81,89 L80,93 Q70,94 60,93 Z" fill="#ffffff"/>
      <!-- Cute Pink Tongue -->
      <path d="M61,99 Q70,94 79,99 Q75,105 70,105 Q65,105 61,99 Z" fill="#f43f5e"/>
    </g>
  </g>
</svg>
